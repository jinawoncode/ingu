<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 동네 인구 검색</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      background: #f3f6fb;
      color: #18253b;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 28px;
    }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 24px #1c315014;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      outline-color: #2563eb;
    }

    #results {
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .item {
      display: block;
      width: 100%;
      padding: 13px;
      border: 0;
      border-bottom: 1px solid #edf0f4;
      background: white;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .item:hover, .item:focus {
      background: #eff6ff;
    }

    .status {
      color: #64748b;
      font-size: 14px;
      margin-top: 12px;
    }

    #detail {
      display: none;
      margin-top: 24px;
    }

    #regionName {
      font-size: 21px;
      margin: 0 0 6px;
      overflow-wrap: anywhere;
    }

    .date {
      color: #64748b;
      font-size: 14px;
    }

    .total {
      margin-top: 24px;
      padding: 22px;
      background: #eff6ff;
      border-radius: 14px;
    }

    .total .value {
      font-size: 36px;
      font-weight: 800;
      color: #1d4ed8;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .stat {
      padding: 20px;
      background: #f8fafc;
      border-radius: 14px;
    }

    .stat .value {
      font-size: 25px;
      font-weight: 750;
      margin-top: 8px;
    }

    .male { color: #2563eb; }
    .female { color: #db2777; }

    .bar {
      display: flex;
      height: 12px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 22px;
      background: #e2e8f0;
    }

    #maleBar { background: #3b82f6; }
    #femaleBar { background: #ec4899; }

    .percentages {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 440px) {
      .panel { padding: 18px; }
      .stat { padding: 15px; }
      .stat .value { font-size: 21px; }
      .total .value { font-size: 30px; }
    }
  </style>
</head>
<body>
<main>
  <h1>우리 동네 인구 검색</h1>
  <p class="subtitle">행정안전부 주민등록 인구통계</p>

  <section class="panel">
    <label for="search">지역 이름 검색</label>
    <input
      id="search"
      type="search"
      placeholder="예: 청운효자동, 강남구, 서울특별시"
      autocomplete="off"
      disabled
    >
    <div id="status" class="status" role="status">
      인구 데이터를 불러오는 중입니다...
    </div>
    <div id="results"></div>
  </section>

  <section id="detail" class="panel">
    <h2 id="regionName"></h2>
    <div id="baseDate" class="date"></div>

    <div class="total">
      <div>총인구</div>
      <div id="total" class="value"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div>남자 인구</div>
        <div id="male" class="value male"></div>
      </div>
      <div class="stat">
        <div>여자 인구</div>
        <div id="female" class="value female"></div>
      </div>
    </div>

    <div class="bar">
      <div id="maleBar"></div>
      <div id="femaleBar"></div>
    </div>
    <div class="percentages">
      <span id="malePercent"></span>
      <span id="femalePercent"></span>
    </div>
  </section>
</main>

<script>
const CSV_URL =
  "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv";

const $ = id => document.getElementById(id);
const formatter = new Intl.NumberFormat("ko-KR");

let regions = [];
let baseDate = "";

function parseNumber(value) {
  const number = Number(
    String(value ?? "").replace(/,/g, "").trim()
  );
  return Number.isFinite(number) ? number : 0;
}

function cleanRegionName(name) {
  return String(name ?? "")
    .replace(/\s*\(\d+\)\s*$/, "")
    .trim();
}

// 따옴표 안의 쉼표와 줄바꿈까지 처리하는 CSV 파서
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let quoted = false;

  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (quoted && text[i + 1] === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (char === "," && !quoted) {
      row.push(field);
      field = "";
    } else if (
      (char === "\n" || char === "\r") && !quoted
    ) {
      if (char === "\r" && text[i + 1] === "\n") {
        i++;
      }

      row.push(field);

      if (row.some(value => value.trim() !== "")) {
        rows.push(row);
      }

      row = [];
      field = "";
    } else {
      field += char;
    }
  }

  row.push(field);
  if (row.some(value => value.trim() !== "")) {
    rows.push(row);
  }

  return rows;
}

function findColumn(headers, pattern) {
  return headers.findIndex(header => pattern.test(header));
}

async function loadData() {
  try {
    const response = await fetch(CSV_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    // 원본 EUC-KR(또는 CP949) 한글 변환
    const buffer = await response.arrayBuffer();
    const decoder = new TextDecoder("euc-kr");
    const text = decoder.decode(buffer);

    const rows = parseCSV(text);
    if (rows.length < 2) {
      throw new Error("CSV에 데이터가 없습니다.");
    }

    const headers = rows[0].map(v => v.trim());

    const nameIndex = findColumn(
      headers, /행정구역|행정기관|지역명/
    );

    const maleIndex = findColumn(
      headers, /_남_총인구수$/
    );

    const femaleIndex = findColumn(
      headers, /_여_총인구수$/
    );

    const totalIndex = findColumn(
      headers, /_계_총인구수$/
    );

    if (
      nameIndex < 0 ||
      maleIndex < 0 ||
      femaleIndex < 0
    ) {
      throw new Error(
        "필요한 CSV 열을 찾을 수 없습니다.\n" +
        headers.slice(0, 12).join(", ")
      );
    }

    const dateMatch =
      headers[maleIndex].match(/(\d{4})년(\d{2})월/);

    baseDate = dateMatch
      ? `${dateMatch[1]}년 ${Number(dateMatch[2])}월 기준`
      : "주민등록 인구 기준";

    regions = rows.slice(1)
      .filter(row => row.length > femaleIndex)
      .map(row => {
        const male = parseNumber(row[maleIndex]);
        const female = parseNumber(row[femaleIndex]);

        return {
          name: cleanRegionName(row[nameIndex]),
          male,
          female,
          total: totalIndex >= 0
            ? parseNumber(row[totalIndex])
            : male + female
        };
      })
      .filter(region => region.name !== "");

    $("search").disabled = false;
    $("status").textContent =
      `${formatter.format(regions.length)}개 지역을 불러왔습니다.`;

  } catch (error) {
    console.error(error);
    $("status").textContent =
      "데이터를 불러오지 못했습니다: " + error.message;
  }
}

function showRegion(region) {
  $("detail").style.display = "block";
  $("regionName").textContent = region.name;
  $("baseDate").textContent = baseDate;

  $("total").textContent =
    formatter.format(region.total) + "명";
  $("male").textContent =
    formatter.format(region.male) + "명";
  $("female").textContent =
    formatter.format(region.female) + "명";

  const sum = region.male + region.female;
  const malePercent = sum
    ? region.male / sum * 100
    : 0;
  const femalePercent = sum
    ? region.female / sum * 100
    : 0;

  $("maleBar").style.width = malePercent + "%";
  $("femaleBar").style.width = femalePercent + "%";

  $("malePercent").textContent =
    "남자 " + malePercent.toFixed(1) + "%";
  $("femalePercent").textContent =
    "여자 " + femalePercent.toFixed(1) + "%";

  $("search").value = region.name;
  $("results").replaceChildren();
  $("status").textContent = "지역을 선택했습니다.";
}

function searchRegions() {
  const keyword = $("search").value.trim().toLowerCase();
  const results = $("results");
  results.replaceChildren();

  if (!keyword) {
    $("status").textContent =
      `${formatter.format(regions.length)}개 지역에서 검색하세요.`;
    return;
  }

  const matches = regions.filter(region =>
    region.name.toLowerCase().includes(keyword)
  );

  const visible = matches.slice(0, 100);

  $("status").textContent =
    `${formatter.format(matches.length)}개 지역 검색됨` +
    (matches.length > 100 ? " (상위 100개 표시)" : "");

  for (const region of visible) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "item";
    button.textContent = region.name;
    button.addEventListener("click", () => {
      showRegion(region);
    });
    results.appendChild(button);
  }
}

$("search").addEventListener("input", searchRegions);

loadData();
</script>
</body>
</html>
